name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite to run'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - api
          - ui
          - unit
      browser:
        description: 'Browser'
        required: false
        default: 'chrome'
        type: choice
        options:
          - chrome
      environment:
        description: 'Environment'
        required: false
        default: 'ci'
        type: string

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: senior-cqc-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run framework unit tests
        run: |
          docker run --rm senior-cqc-tests:latest \
            SeniorCQCAssignment.slnx \
            --no-restore \
            -c Release \
            --filter "Category=unit" \
            --logger "console;verbosity=normal" \
            --results-directory /app/TestResults

  test-api:
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: senior-cqc-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run API tests
        run: docker compose up --build --exit-code-from tests-api
        env:
          COMPOSE_PROFILES: api

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            TestResults/
            allure-results/

  test-ui:
    runs-on: ubuntu-latest
    needs: build-and-lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: senior-cqc-tests:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run UI tests
        run: docker compose up --build --exit-code-from tests-ui
        env:
          COMPOSE_PROFILES: ui

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results
          path: |
            TestResults/
            allure-results/

  report:
    runs-on: ubuntu-latest
    needs: [test-api, test-ui]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download API results
        uses: actions/download-artifact@v4
        with:
          name: api-test-results
          path: api-results

      - name: Download UI results
        uses: actions/download-artifact@v4
        with:
          name: ui-test-results
          path: ui-results

      - name: Setup Allure
        uses: simple-elf/allure-report-action@v1.9
        with:
          allure_results: api-results/allure-results,ui-results/allure-results
          allure_history: allure-history
          keep_reports: 20

      - name: Deploy report to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: allure-history
          publish_branch: gh-pages

  notify:
    runs-on: ubuntu-latest
    needs: [report]
    if: always() && (github.event_name == 'schedule' || github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && failure()))
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "CI ${{ job.status }} - ${{ github.repository }}"
          to: ${{ secrets.NOTIFICATION_EMAIL }}
          from: "CI Bot <${{ secrets.SMTP_USERNAME }}>"
          body: |
            Build Status: ${{ needs.report.result }}
            Branch: ${{ github.ref }}
            Commit: ${{ github.sha }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
